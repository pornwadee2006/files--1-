; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; ค่าเริ่มต้น: อัปโหลดผ่านสาย USB
default_envs = ota

; ค่าที่ใช้ร่วมกันทุก env
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps = knolleary/PubSubClient@^2.8
monitor_speed = 115200

; อัปโหลดผ่านสาย USB:  pio run -e usb -t upload
; (ไม่ตั้ง upload_port = ให้ PlatformIO หาพอร์ตเอง
;  ถ้าต้องการระบุ ให้เพิ่ม เช่น upload_port = COM5)
[env:usb]
upload_protocol = esptool

; อัปโหลดผ่าน WiFi:
;   pio run -e ota -t upload --upload-port esp32-lowpower.local (หรือ IP จาก Serial Monitor)
[env:ota]
upload_protocol = espota
upload_port = 10.62.35.160
upload_flags = --auth=ESP32OTA
    --timeout=30